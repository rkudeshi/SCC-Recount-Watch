name: Update results

on:
  # Clarity returns empty responses to GitHub-hosted runners, so the daily
  # check runs elsewhere (a scheduled Claude task) and pushes data/ here.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update.py
      - config.json
      - .github/workflows/update.yml
      - data/**

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Clarity for a new results version
        id: fetch
        run: python update.py

      # Code or config changed, or a manual run: rebuild the page from the
      # last good data even if the county has not posted anything new.
      - name: Re-render from saved data
        id: render
        if: steps.fetch.outputs.changed != 'true' && github.event_name != 'schedule'
        run: python update.py --render-only

      - name: Decide
        id: result
        run: |
          if [ "${{ steps.fetch.outputs.changed }}" = "true" ] || [ "${{ steps.render.outputs.changed }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit processed data
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Update results to version $(python -c 'import json;print(json.load(open("data/state.json"))["version"])')"
          git push

      - name: Upload site
        if: steps.result.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
